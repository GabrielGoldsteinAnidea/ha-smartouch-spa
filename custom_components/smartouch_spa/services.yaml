send_raw:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: smartouch_spa
    uuid:
      required: true
      example: "12ead13c-4d06-48b7-a3f9-cdf725acdd87"
      selector:
        text:
    data:
      required: true
      example: "6c 30"
      selector:
        text:
press_button:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: smartouch_spa
    button:
      required: true
      selector:
        select:
          options: [light, jets, aux, aux2, system, up, down, set_temp, set_time]
